# =============================================================================
# CẤU HÌNH TỐI ƯU HÓA NGINX: UPLOAD FILE 10MB & NÉN GZIP TỐC ĐỘ CAO
# Vị trí: /etc/nginx/nginx.conf (hoặc tạo file con trong /etc/nginx/conf.d/optimization.conf)
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # CẤU HÌNH TRUYỀN DẪN FILE TỐC ĐỘ CAO
    # -------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Ẩn phiên bản Nginx trong Header Response để tăng tính bảo mật
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # YÊU CẦU 1: CẤU HÌNH CHO PHÉP UPLOAD FILE LÊN ĐẾN 10MB (KHẮC PHỤC LỖI 413)
    # =========================================================================
    # Mặc định của Nginx là 1MB (1m). Khi người dùng tải ảnh avatar 3MB sẽ bị lỗi:
    # "413 Request Entity Too Large"
    # Thiết lập 10M cho phép kích thước tối đa của Request Body đạt 10MB:
    client_max_body_size 10M;

    # Kích thước bộ đệm cho body của client trong RAM trước khi ghi ra file tạm
    client_body_buffer_size 128k;

    # =========================================================================
    # YÊU CẦU 2: BẬT TÍNH NĂNG NÉN GZIP GIẢM TẢI JS/CSS VÀ TĂNG TỐC ĐỘ WEB
    # =========================================================================
    # Bật module nén Gzip
    gzip on;

    # Bật header 'Vary: Accept-Encoding' để proxy và trình duyệt lưu cache chính xác
    gzip_vary on;

    # Cho phép nén response kể cả khi request đi qua proxy/CDN trung gian
    gzip_proxied any;

    # Mức độ nén (từ 1 đến 9):
    # Mức 6 là mức cân bằng hoàn hảo (sweet spot) giữa tỉ lệ nén tối đa và mức tiêu thụ CPU
    gzip_comp_level 6;

    # Dung lượng tối thiểu (bytes) để kích hoạt nén:
    # Các file dưới 256 bytes không nén vì tiêu đề nén (header overhead) làm file phình to hơn
    gzip_min_length 256;

    # Số lượng và kích thước bộ đệm dành cho nén
    gzip_buffers 16 8k;

    # Hỗ trợ HTTP 1.1 cho nén
    gzip_http_version 1.1;

    # Danh sách các định dạng MIME Type cần nén:
    # (Lưu ý: text/html luôn được nén mặc định)
    # Tuyệt đối KHÔNG nén các file nhị phân đã nén sẵn như JPG, PNG, GIF, MP4, ZIP
    # vì nén lại không giảm được dung lượng mà gây lãng phí CPU server nghiêm trọng!
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # -------------------------------------------------------------------------
    # CẤU HÌNH NHẬT KÝ (LOGGING)
    # -------------------------------------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # -------------------------------------------------------------------------
    # NẠP CÁC FILE CẤU HÌNH VIRTUAL HOST
    # -------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
