# =============================================================================
# Cấu hình Nginx HTTPS chuẩn cho domain: api.my-ecommerce.com
# Vị trí file: /etc/nginx/sites-available/api.my-ecommerce.com
# Kích hoạt: sudo ln -sf /etc/nginx/sites-available/api.my-ecommerce.com /etc/nginx/sites-enabled/
# =============================================================================

# =============================================================================
# BLOCK 1: HTTP (PORT 80) -> TỰ ĐỘNG CHUYỂN HƯỚNG VĨNH VIỄN SANG HTTPS (PORT 443)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api.my-ecommerce.com;

    # Mã HTTP 301 Permanent Redirect: Bắt buộc trình duyệt và crawler chuyển sang HTTPS
    # Giữ nguyên toàn bộ domain và đường dẫn truy vấn ($host$request_uri)
    return 301 https://$host$request_uri;
}

# =============================================================================
# BLOCK 2: HTTPS (PORT 443) -> XỬ LÝ MÃ HÓA SSL/TLS & PROXY SANG BACKEND
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.my-ecommerce.com;

    # -------------------------------------------------------------------------
    # CHỨNG CHỈ SSL VÀ PRIVATE KEY TỪ LET'S ENCRYPT
    # -------------------------------------------------------------------------
    # ssl_certificate: File fullchain.pem chứa Server Certificate + Intermediate CA Certificate
    ssl_certificate /etc/letsencrypt/live/api.my-ecommerce.com/fullchain.pem;

    # ssl_certificate_key: File privkey.pem chứa Private Key bí mật của server
    ssl_certificate_key /etc/letsencrypt/live/api.my-ecommerce.com/privkey.pem;

    # -------------------------------------------------------------------------
    # CẤU HÌNH BẢO MẬT SSL/TLS NÂNG CAO (Theo chuẩn bảo mật Mozilla Intermediate)
    # -------------------------------------------------------------------------
    # Chỉ hỗ trợ các phiên bản giao thức an toàn: TLSv1.2 và TLSv1.3 (Loại bỏ SSLv3, TLS 1.0, 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Danh sách thuật toán mã hóa (Cipher Suites) hiện đại, an toàn cao
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Tối ưu hóa hiệu năng TLS Handshake thông qua Session Cache
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # Lưu cache trong RAM dùng chung giữa các worker
    ssl_session_tickets off;

    # OCSP Stapling: Tăng tốc độ xác thực trạng thái chứng chỉ của trình duyệt
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HTTP Strict Transport Security (HSTS): Ngăn chặn triệt để tấn công hạ cấp (Downgrade attack)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # -------------------------------------------------------------------------
    # ĐỊNH TUYẾN PROXY VÀO BACKEND API GATEWAY (PORT 8080)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Khai báo rõ giao thức đã mã hóa HTTPS

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
    }
}
