input {
  tcp {
    port => 5000
    # ĐÃ SỬA: Sử dụng codec json_lines để nhận diện và parse từng dòng JSON (NDJSON) được gửi từ Logback TCP Appender
    codec => json_lines
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "storex-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
