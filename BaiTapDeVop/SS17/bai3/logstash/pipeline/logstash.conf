input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # BẪY KỸ THUẬT 1: Fallback nếu log gửi lên thiếu trường app_name
  if ![app_name] or [app_name] == "" {
    mutate {
      add_field => { "app_name" => "storex-default" }
    }
  }

  # BẪY KỸ THUẬT 2: Elasticsearch bắt buộc tên index phải là CHỮ THƯỜNG (lowercase)
  # Nếu app_name có chữ in hoa (ví dụ: UserService), Elasticsearch sẽ báo lỗi InvalidIndexNameException
  mutate {
    lowercase => [ "app_name" ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # ĐÃ SỬA: Phân loại index động theo tên ứng dụng và ngày tháng
    index => "%{[app_name]}-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
