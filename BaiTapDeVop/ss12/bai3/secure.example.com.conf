server {
    listen 443 ssl http2;
    server_name secure.example.com;

    # Đường dẫn chứng chỉ SSL/TLS
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Cấu hình giao thức & mã hóa SSL/TLS an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ========================================================
    # CẤU HÌNH HTTP SECURITY HEADERS (THEO TIÊU CHUẨN OWASP)
    # Lưu ý: Cờ 'always' đảm bảo header luôn được trả về kể cả khi gặp mã lỗi 4xx/5xx
    # ========================================================

    # 1. Chống tấn công Clickjacking / UI Redressing
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 2. Chống tấn công MIME-Type Confusion / Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # 3. HTTP Strict Transport Security (HSTS) - Bắt buộc HTTPS trong 1 năm
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # 4. Các Security Headers bổ sung tăng cường bảo mật cấp cao
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://localhost:8080;

        # Thiết lập các proxy headers chuẩn hóa
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Tự động chuyển hướng từ HTTP (Port 80) sang HTTPS (Port 443)
server {
    listen 80;
    server_name secure.example.com;
    return 301 https://$host$request_uri;
}
