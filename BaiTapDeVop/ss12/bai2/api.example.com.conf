server {
    listen 80;
    server_name api.example.com;

    location /api/export/ {
        proxy_pass http://localhost:8080;

        # Thiết lập các HTTP Headers cần thiết
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ========================================================
        # TỐI ƯU HÓA TIMEOUT CHO TÁC VỤ XỬ LÝ DỮ LIỆU NẶNG (EXPORT)
        # ========================================================
        
        # 1. Thời gian chờ thiết lập kết nối TCP với Upstream Backend
        proxy_connect_timeout 120s;

        # 2. Thời gian chờ truyền tải dữ liệu request từ Nginx sang Backend
        proxy_send_timeout 120s;

        # 3. Thời gian chờ Backend xử lý và bắt đầu trả dữ liệu về Nginx (Khắc phục lỗi 504)
        proxy_read_timeout 120s;

        # 4. Thời gian chờ Nginx gửi dữ liệu response về cho Client (Trình duyệt)
        send_timeout 120s;

        # 5. Cấu hình đệm (buffer) để tối ưu việc truyền tải file báo cáo lớn
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Các API thông thường khác vẫn giữ timeout chuẩn để tránh nghẽn tài nguyên
    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
